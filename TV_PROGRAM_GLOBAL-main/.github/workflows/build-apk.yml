name: Izgradnja APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "*.zip"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testovi:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testovi
        run: bash ci/test.sh

  apk:
    needs: testovi
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Izgradi APK
        run: bash ci/build.sh

      - name: Sacuvaj APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tv-program-global-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Objavi APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK izgradnja ${{ github.run_number }}
          prerelease: true
          files: bin/*.apk
