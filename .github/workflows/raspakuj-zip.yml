name: Raspakuj ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: raspakuj-zip
  cancel-in-progress: false

jobs:
  raspakuj:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Raspakuj ZIP fajlove
        run: |
          shopt -s nullglob
          # Ostaci ranijih pogresnih raspakivanja (ZIP sa spoljasnjim folderom) se brisu sami
          for d in TV_PROGRAM_GLOBAL-main*; do
            if [ -d "$d" ]; then
              echo "Brisem pogresan folder: $d"
              git rm -r -f -q "$d" 2>/dev/null || rm -rf "$d"
              rm -rf "$d"
            fi
          done
          fajlovi=(*.zip)
          if [ ${#fajlovi[@]} -eq 0 ]; then
            echo "Nema ZIP fajlova u korenu repozitorijuma."
          fi
          for z in "${fajlovi[@]}"; do
            echo "Raspakujem: $z"
            tmp=$(mktemp -d)
            unzip -q -o "$z" -x '.git/*' '.github/*' '__MACOSX/*' -d "$tmp"
            # ZIP sa jednim spoljasnjim folderom TV_PROGRAM_GLOBAL* (npr. preuzet sa GitHub-a):
            # sadrzaj tog foldera ide u koren repozitorijuma
            mapfile -t stavke < <(ls -A "$tmp")
            src="$tmp"
            if [ ${#stavke[@]} -eq 1 ] && [ -d "$tmp/${stavke[0]}" ] && [[ "${stavke[0]}" == TV_PROGRAM_GLOBAL* ]]; then
              echo "Spoljasnji folder ${stavke[0]} se preskace."
              src="$tmp/${stavke[0]}"
            fi
            cp -a "$src"/. .
            rm -rf "$tmp"
            git rm -f --quiet "$z"
          done

      - name: Snimi promene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nema promena."
            exit 0
          fi
          git commit -m "Raspakovan ZIP"
          git pull --rebase
          git push

      - name: Pokreni izgradnju APK-a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/workflows/build-apk.yml ]; then
            gh workflow run build-apk.yml
          fi
